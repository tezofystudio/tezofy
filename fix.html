<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEZOFY — Cache Reset</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f1020;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
  .card{padding:40px 24px;max-width:440px}
  .spin{width:46px;height:46px;margin:0 auto 18px;border:4px solid rgba(255,255,255,.15);border-top-color:#8b5cf6;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  h1{font-size:21px;margin:0 0 10px}
  p{color:#a5b4fc;margin:0 0 10px;font-size:14.5px;line-height:1.65}
  .ok{color:#34d399;font-weight:600;min-height:22px}
  a.btn{display:inline-block;margin-top:18px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;text-decoration:none;font-weight:700;padding:12px 30px;border-radius:999px;font-size:15px}
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h1>Clearing old cache…</h1>
  <p>পুরনো ফাইল-ক্যাশ মুছে ফেলা হচ্ছে — কয়েক সেকেন্ডেই হোম-পেজে ফিরে যাবেন।<br>Old cached files are being removed. You will be back on the homepage shortly.</p>
  <p class="ok" id="status">Working…</p>
  <a class="btn" href="index.html">Go to Home now</a>
</div>
<script>
(function () {
  "use strict";
  var done = false;
  function finish(ok) {
    if (done) return;
    done = true;
    var s = document.getElementById("status");
    if (s) s.textContent = ok ? "Done! Redirecting…" : "Done — please tap the button below.";
  }
  function reset() {
    var p = Promise.resolve();
    if ("serviceWorker" in navigator) {
      p = p.then(function () {
        return navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        });
      });
    }
    if (window.caches) {
      p = p.then(function () {
        return caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        });
      });
    }
    p.then(function () {
      finish(true);
      setTimeout(function () { location.replace("index.html"); }, 800);
    }).catch(function () { finish(false); });
  }
  reset();
})();
</script>
