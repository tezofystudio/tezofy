<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>👑 Creator Profile — Your AI Studio | TEZOFY</title>
  <meta name="description" content="Your TEZOFY creator profile — design your profile photo & cover with your own image, save and share your AI creations, earn coins and track your level.">
  <meta property="og:title" content="Creator Profile — TEZOFY">
  <meta property="og:description" content="Design your profile photo & cover, save & share your AI creations, earn coins.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    /* theme boot (same pattern as every TEZOFY page) */
    (function () { try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("chitro:theme") || '"dark"'); } catch (e) { document.documentElement.dataset.theme = "dark"; } })();
  </script>

  <style id="tzpProfileStyle">
  /* ============================================================
     TEZOFY Creator Profile — professional theme (v2)
     Matches site tokens: --card, --grad, --pink, --orange …
     ============================================================ */
  .tzp-hero{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;margin-bottom:18px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
  .tzp-cover{height:190px;position:relative;background:var(--card-2)}
  .tzp-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .tzp-cover-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,rgba(255,45,170,.18),rgba(255,122,0,.18))}
  .tzp-fab{position:absolute;top:146px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:rgba(9,9,11,.72);backdrop-filter:blur(6px);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;z-index:3}
  .tzp-fab:hover{border-color:var(--pink);transform:scale(1.06)}
  .tzp-head{display:flex;gap:18px;align-items:flex-end;padding:0 22px 16px;margin-top:-46px;position:relative;flex-wrap:wrap}
  .tzp-ava-wrap{position:relative;flex-shrink:0;width:96px;height:96px}
  .tzp-ava{width:96px;height:96px;border-radius:50%;background:var(--card-2);border:4px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;overflow:hidden;color:var(--text)}
  .tzp-ava img{width:100%;height:100%;object-fit:cover}
  .tzp-ring{position:absolute;inset:-5px;border-radius:50%;border:3px solid transparent;pointer-events:none}
  .tzp-ava-edit{position:absolute;bottom:-2px;right:-2px;width:32px;height:32px;border-radius:50%;border:2px solid var(--bg);background:var(--grad);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .tzp-ava-edit:hover{transform:scale(1.1)}
  .tzp-id{flex:1;min-width:220px;padding-bottom:2px}
  .tzp-id h1{font-size:22px;margin:0 0 5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800}
  .tzp-tier{font-size:11px;font-weight:700;padding:3px 11px;border-radius:999px;border:1px solid;letter-spacing:.3px;white-space:nowrap}
  .tzp-muted{color:var(--muted);font-size:13.5px;margin:0 0 7px}
  .tzp-bio{margin:0;font-size:14.5px;line-height:1.55;max-width:640px;color:var(--text)}
  .tzp-head-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-bottom:4px}
  .tzp-coin-chip{background:var(--grad);color:#fff;font-weight:800;font-size:14px;padding:7px 15px;border-radius:999px;box-shadow:0 6px 18px rgba(255,45,170,.35)}
  .tzp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;padding:0 22px 16px}
  .tzp-stat{background:var(--card-2);border:1px solid var(--border-soft);border-radius:14px;padding:11px 8px;text-align:center}
  .tzp-stat b{display:block;font-size:18px;margin-bottom:2px}
  .tzp-stat span{font-size:11.5px;color:var(--muted)}
  .tzp-lvlbar{margin:0 22px 20px;height:8px;background:var(--card-2);border-radius:999px;overflow:hidden}
  .tzp-lvlbar i{display:block;height:100%;border-radius:inherit}
  .tzp-gate-tabs{margin:16px auto;justify-content:center}
  .tzp-tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);padding:6px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;margin:0 auto 20px}
  .tzp-tab{border:none;background:transparent;color:var(--muted);font:600 13.5px/1 ;padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s;font-family:inherit}
  .tzp-tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(255,45,170,.35)}
  .tzp-h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);margin:26px 0 12px;font-weight:800}
  .tzp-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tzp-q{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:.2s}
  .tzp-q:hover{transform:translateY(-3px);border-color:var(--pink)}
  .tzp-q b{font-size:15px}
  .tzp-q span{font-size:13px;color:var(--muted);line-height:1.5}
  .tzp-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
  .tzp-card b{display:block;font-size:17px;margin-bottom:3px}
  .tzp-card span{font-size:12.5px;color:var(--muted)}
  .tzp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tzp-btn{background:var(--grad);color:#fff;border:none;padding:10px 20px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s;font-family:inherit;text-decoration:none}
  .tzp-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,45,170,.4)}
  .tzp-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .tzp-btn.ghost:hover{border-color:var(--pink);box-shadow:none}
  .tzp-btn.danger{background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.4);color:#ff9c9c}
  .tzp-btn.danger:hover{box-shadow:0 8px 20px rgba(255,77,109,.25)}
  .tzp-btn.big{padding:14px 30px;font-size:15px}
  .tzp-set{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .tzp-lab{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.2px}
  .tzp-inp{width:100%;box-sizing:border-box;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);font:inherit;font-size:14.5px}
  .tzp-inp:focus{outline:none;border-color:var(--pink)}
  .tzp-switch{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:12px;cursor:pointer;font-size:14px;user-select:none}
  .tzp-switch input{width:17px;height:17px;accent-color:var(--pink);cursor:pointer}
  .tzp-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
  .tzp-cre{margin:0;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative}
  .tzp-cre img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  .tzp-cre figcaption{padding:9px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tzp-cre-acts{position:absolute;top:8px;right:8px;display:flex;gap:6px}
  .tzp-cre-acts button{width:31px;height:31px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(9,9,11,.66);backdrop-filter:blur(4px);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  .tzp-cre-acts button:hover{background:var(--grad)}
  .tzp-empty{grid-column:1/-1;text-align:center;padding:46px 14px;color:var(--muted)}
  .tzp-empty div{font-size:42px;margin-bottom:10px}
  .tzp-empty p{margin:0 0 4px}
  .tzp-err{color:#ff9c9c;font-size:13px;min-height:18px;margin:6px 0 0}
  .tzp-ov{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;padding:18px}
  .tzp-ov.open{display:flex}
  .tzp-sheet{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;position:relative}
  .tzp-sheet .tzp-h3:first-child{margin-top:0}
  .tzp-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--card-2);border:1px solid var(--border);color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
  .tzp-x:hover{color:var(--text);border-color:var(--pink)}
  .tzp-lb{text-align:center}
  .tzp-lb img{max-width:100%;border-radius:14px;margin-bottom:10px}
  .tzp-presets{display:flex;gap:8px;flex-wrap:wrap}
  .tzp-preset{padding:8px 14px;border-radius:999px;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);font:600 12.5px/1 inherit;font-family:inherit;cursor:pointer;transition:.2s}
  .tzp-preset:hover{border-color:var(--pink)}
  .tzp-stage{background:var(--bg-soft);border:1px solid var(--border-soft);border-radius:14px;min-height:110px;display:flex;align-items:center;justify-content:center;padding:14px;text-align:center}
  .tzp-ava-stage{display:flex;justify-content:center;margin:10px 0}
  .tzp-ava-big{width:140px;height:140px;border-radius:50%;background:var(--card-2);border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
  .tzp-ava-big img{width:100%;height:100%;object-fit:cover}
  .tzp-loading{text-align:center;padding:34px 10px;color:var(--muted);font-size:14px}
  .tzp-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--pink);animation:tzpspin 1s linear infinite;margin:0 auto 12px}
  @keyframes tzpspin{to{transform:rotate(360deg)}}
  .tzp-log{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:var(--bg-soft);border-radius:10px;font-size:13.5px}
  .tzp-log span{color:var(--muted)}
  .tzp-log b{color:var(--orange)}
  .tzp-rules{display:flex;flex-direction:column;gap:8px}
  .tzp-rule{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:var(--bg-soft);border-radius:10px;font-size:13.5px}
  .tzp-rule span{color:var(--muted)}
  .tzp-rule b{color:var(--orange);white-space:nowrap}
  .tzp-coin-hero{background:linear-gradient(135deg,rgba(255,45,170,.14),rgba(255,122,0,.14));border:1px solid var(--border);border-radius:18px;padding:24px 18px;text-align:center;margin-bottom:16px}
  .tzp-coin-hero small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:11px;margin-bottom:6px}
  .tzp-coin-hero b{font-size:42px}
  .tzp-rec{display:flex;flex-wrap:wrap;gap:8px}
  .tzp-rec-chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 15px;font-size:13px;color:inherit;text-decoration:none;transition:.2s}
  .tzp-rec-chip:hover{border-color:var(--pink)}
  .tzp-gate{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px 0}
  .tzp-gate-card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px 26px;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.35)}
  .tzp-gate-emoji{width:68px;height:68px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
  .tzp-gate-card h1{font-size:23px;margin:0 0 8px}
  .tzp-toast{position:fixed;bottom:calc(var(--bottombar-h, 70px) + 14px);left:50%;transform:translateX(-50%);background:var(--card-2);border:1px solid var(--border);color:var(--text);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:1000;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:tzpup .25s ease}
  @keyframes tzpup{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .tzp-muted.small,.tzp-small{font-size:12.5px}
  @media (max-width:640px){
    .tzp-cover{height:150px}
    .tzp-fab{top:118px}
    .tzp-head{padding:0 16px 14px;gap:14px}
    .tzp-ava-wrap,.tzp-ava{width:78px;height:78px}
    .tzp-ava{font-size:28px}
    .tzp-id h1{font-size:19px}
    .tzp-head-side{flex-direction:row;width:100%;align-items:center;justify-content:flex-start;flex-wrap:wrap}
    .tzp-stats,.tzp-lvlbar{margin-left:16px;margin-right:16px;padding-left:0;padding-right:0}
    .tzp-grid3{grid-template-columns:1fr}
  }
  </style>
</head>
<body data-page="profile">

  <!-- ─── topbar (site shell) ─── -->
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="TEZOFY home">
        <span class="brand-mark"><img src="assets/icons/logo.png" alt="TEZOFY logo"></span>
        <span>TEZOFY<small>Creator Profile</small></span>
      </a>
      <div class="header-actions">
        <a class="header-search-pill" href="discover.html" aria-label="Search prompts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span>Search prompts…</span>
        </a>
        <button class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle dark / light mode"></button>
        <span id="avatarHost"><a class="avatar-btn" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></a></span>
      </div>
    </div>
  </header>

  <!-- ─── profile root (profile.js builds everything here) ─── -->
  <main class="wrap" id="profileRoot" style="padding:26px 0 90px">
    <div class="tzp-boot" style="text-align:center;padding:70px 0;color:var(--muted-2)">
      <div style="font-size:44px">👑</div>
      <p>Loading your creator profile…</p>
    </div>
  </main>

  <!-- ─── bottom nav (app-feel) ─── -->
  <nav class="bottombar" aria-label="Primary">
    <a href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>Home</span></a>
    <a href="discover.html" aria-label="Discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search</span></a>
    <a href="ai-generator.html" aria-label="Create Image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Create</span></a>
    <a href="profile.html" class="active" aria-label="My profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg><span>Profile</span></a>
  </nav>

  <!-- site data + engines (standalone page: app.js is NOT loaded, so nothing else on the site is affected) -->
  <script src="assets/js/data.js"></script>
  <script src="assets/js/tezo-topics.js"></script>
  <script src="assets/js/auth-cloud.js"></script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/ai-menu.js" defer></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
